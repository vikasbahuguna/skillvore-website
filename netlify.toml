# Netlify configuration for SkillVore website

[build]
  # Build command (if you're using a build process)
  command = "echo 'No build process required for static site'"
  
  # Directory to publish (where your built site files are)
  publish = "."

# Redirect rules
[[redirects]]
  from = "/contact-success"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

# Form handling settings
[build.environment]
  # Set any environment variables here
  NODE_VERSION = "18"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Performance headers
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=1800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Function settings (if using Netlify Functions)
[functions]
  directory = "netlify/functions"

# Form settings
[forms]
  # Enable form detection
  enabled = true

# Plugin configuration
[[plugins]]
  package = "@netlify/plugin-sitemap"

# Development settings
[dev]
  command = "python -m http.server 8000"
  port = 8000
  targetPort = 8000
  publish = "."
  autoLaunch = true
