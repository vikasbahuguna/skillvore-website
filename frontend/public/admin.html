<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitlist Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1a365d 0%, #2c5aa0 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8fafc;
        }

        .stat-box {
            background: linear-gradient(135deg, #00d4ff 0%, #1a365d 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
        }

        .stat-box i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .stat-box h3 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .stat-box p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .actions {
            padding: 20px 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 2px solid #e2e8f0;
        }

        .btn {
            background: #00d4ff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn:hover {
            background: #00b8db;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .btn.secondary {
            background: #1a365d;
        }

        .btn.secondary:hover {
            background: #2c5aa0;
        }

        .table-container {
            padding: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1a365d;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #f8fafc;
        }

        .email {
            color: #00d4ff;
            font-weight: 500;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #718096;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            margin: 30px;
            border-radius: 10px;
            border-left: 4px solid #dc2626;
        }

        .empty {
            text-align: center;
            padding: 50px;
            color: #718096;
        }

        .empty i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .refresh-info {
            text-align: center;
            padding: 10px;
            color: #718096;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> Waitlist Dashboard</h1>
            <p>SkillVore - AI Agents Waitlist Management</p>
        </div>

        <div class="stats" id="stats">
            <div class="stat-box">
                <i class="fas fa-users"></i>
                <h3 id="totalCount">-</h3>
                <p>Total Signups</p>
            </div>
            <div class="stat-box">
                <i class="fas fa-calendar-day"></i>
                <h3 id="todayCount">-</h3>
                <p>Today</p>
            </div>
            <div class="stat-box">
                <i class="fas fa-building"></i>
                <h3 id="businessTypes">-</h3>
                <p>Business Types</p>
            </div>
        </div>

        <div class="actions">
            <button class="btn" onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
            <button class="btn" onclick="exportCSV()">
                <i class="fas fa-file-csv"></i> Export CSV
            </button>
            <button class="btn" onclick="exportJSON()">
                <i class="fas fa-file-code"></i> Export JSON
            </button>
            <button class="btn secondary" onclick="window.location.href='/'">
                <i class="fas fa-home"></i> Back to Website
            </button>
        </div>

        <div class="table-container">
            <div id="loading" class="loading">
                <i class="fas fa-spinner fa-spin"></i> Loading data...
            </div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="empty" class="empty" style="display: none;">
                <i class="fas fa-inbox"></i>
                <h3>No signups yet</h3>
                <p>Waitlist entries will appear here once people start signing up.</p>
            </div>
            <table id="dataTable" style="display: none;">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Company</th>
                        <th>Business Type</th>
                        <th>Signup Date</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

        <div class="refresh-info">
            Last updated: <span id="lastUpdate">-</span> | 
            <a href="#" onclick="refreshData(); return false;">Click to refresh</a>
        </div>
    </div>

    <script>
        let allData = [];

        async function loadData() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const empty = document.getElementById('empty');
            const table = document.getElementById('dataTable');

            loading.style.display = 'block';
            error.style.display = 'none';
            empty.style.display = 'none';
            table.style.display = 'none';

            try {
                const response = await fetch('/.netlify/functions/waitlist-all');
                
                if (!response.ok) {
                    throw new Error('Failed to load data');
                }

                const data = await response.json();
                allData = data.entries || [];

                loading.style.display = 'none';

                if (allData.length === 0) {
                    empty.style.display = 'block';
                    updateStats(0, 0, 0);
                } else {
                    table.style.display = 'table';
                    renderTable(allData);
                    updateStats(data.count, getTodayCount(allData), getUniqueBusinessTypes(allData));
                }

                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();

            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.innerHTML = `<strong>Error:</strong> ${err.message}. Please check if the backend API is running.`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach((entry, index) => {
                const row = document.createElement('tr');
                const date = new Date(entry.created_at);
                
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${entry.full_name}</strong></td>
                    <td class="email">${entry.work_email}</td>
                    <td>${entry.company_name}</td>
                    <td><span class="badge">${entry.business_type}</span></td>
                    <td>${date.toLocaleDateString()} ${date.toLocaleTimeString()}</td>
                `;
                
                tbody.appendChild(row);
            });
        }

        function updateStats(total, today, businessTypes) {
            document.getElementById('totalCount').textContent = total;
            document.getElementById('todayCount').textContent = today;
            document.getElementById('businessTypes').textContent = businessTypes;
        }

        function getTodayCount(data) {
            const today = new Date().toDateString();
            return data.filter(entry => {
                const entryDate = new Date(entry.created_at).toDateString();
                return entryDate === today;
            }).length;
        }

        function getUniqueBusinessTypes(data) {
            const types = new Set(data.map(entry => entry.business_type));
            return types.size;
        }

        function refreshData() {
            loadData();
        }

        function exportCSV() {
            if (allData.length === 0) {
                alert('No data to export');
                return;
            }

            let csv = 'Full Name,Work Email,Company Name,Business Type,Signup Date\n';
            
            allData.forEach(entry => {
                const date = new Date(entry.created_at).toISOString();
                csv += `"${entry.full_name}","${entry.work_email}","${entry.company_name}","${entry.business_type}","${date}"\n`;
            });

            downloadFile(csv, 'waitlist_export_' + new Date().toISOString().split('T')[0] + '.csv', 'text/csv');
        }

        function exportJSON() {
            if (allData.length === 0) {
                alert('No data to export');
                return;
            }

            const json = JSON.stringify(allData, null, 2);
            downloadFile(json, 'waitlist_export_' + new Date().toISOString().split('T')[0] + '.json', 'application/json');
        }

        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type: type });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        // Load data on page load
        loadData();

        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
